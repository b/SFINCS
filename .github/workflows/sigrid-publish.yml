name: sigrid-publish
on:
  push:
    branches:
      - "main"

jobs:
  sigridci:
    # Sigrid CI runs only on the Deltares upstream repo, where SIGRID_CI_TOKEN
    # is configured. On forks the secret is absent and the job fails; skip it.
    if: github.repository == 'Deltares/SFINCS'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Download Sigrid CI
        run: "git clone https://github.com/Software-Improvement-Group/sigridci.git sigridci"
      - name: "Run Sigrid CI" 
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
        run: "./sigridci/sigridci/sigridci.py --customer deltares --system sfincs --source . --publish" 
